<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HumanAgent task input entry" />
    <title>HumanAgent · Task Input</title>
    <link rel="stylesheet" href="./runtime.css" />
    <link rel="stylesheet" href="./interaction-work-card.css" />
    <style>
      /* runtime.css styles every `label` with `display: grid`, which outranks the
         user-agent `[hidden] { display: none }` rule. Without this rule the
         entry form's hidden scheduling fields keep rendering, so the default
         单次 form would expose timezone/start/end/recurrence controls. */
      #entry-form [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="main-content" class="page">
      <section class="region" aria-labelledby="interaction-work-card-title" data-region="interaction-work-card">
        <header class="region-heading">
          <div>
            <span class="region-kicker">当前交互</span>
            <h2 id="interaction-work-card-title">新建任务进度</h2>
          </div>
          <span class="section-meta">统一交互工作卡</span>
        </header>
        <div
          class="interaction-work-card-host"
          data-interaction-work-card
          data-interaction-work-card-host
          data-entry="entry"
        ></div>
      </section>
    </main>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
