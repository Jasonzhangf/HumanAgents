<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HumanAgent 新任务输入：一次提交即确认本次新任务" />
    <title>HumanAgent · Task Input</title>
    <link rel="stylesheet" href="./runtime.css" />
    <link rel="stylesheet" href="./interaction-work-card.css" />
    <style>
      /* runtime.css styles every `label` with `display: grid`, which outranks the
         user-agent `[hidden] { display: none }` rule. Without this rule the
         entry form's hidden scheduling fields keep rendering, so the default
         单次 form would expose timezone/start/end/recurrence controls. */
      #entry-form [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="page-root"></div>
    <div
      class="interaction-work-card-host"
      data-interaction-work-card
      data-interaction-work-card-host
      data-entry="entry"
    ></div>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
