            if (complete) {
              nodes.push(
                el('div', { class: 'notice notice--info', 'data-tour-complete': 'true' }, [
                  icon('i-check', 'icon--sm'),
                  el('div', { class: 'stack stack--tight' }, [
                    el('strong', { text: '导览完成' }),
                    el('span', { text: '这只表示 27 站导览结束，不代表功能验收通过。' }),
                  ]),
                ])
              );
            }
            if (catalogOpen) {
              nodes.push(
                el('div', { class: 'tour-catalog', 'data-control': 'tour-catalog' }, STATIONS.map(function (item, itemIndex) {
                  return el('button', {
                    class: 'tour-catalog-item',
                    type: 'button',
                    'aria-current': itemIndex === index ? 'true' : 'false',
                    onclick: function () {
                      catalogOpen = false;
                      enter(itemIndex);
                    },
                  }, [
                    el('span', { class: 'tour-catalog-index', text: String(itemIndex + 1).padStart(2, '0') }),
                    el('span', { text: item.title }),
                  ]);
                }))
              );
            }
            body.replaceChildren.apply(body, nodes);
            actions.replaceChildren(
              actionButton('上一站', index === 0, previous),
              actionButton('下一站', index === STATIONS.length - 1, next),
              actionButton(catalogOpen ? '收起目录' : '目录', false, function () {
                catalogOpen = !catalogOpen;
                render();
              }),
              actionButton('重来', false, restart),
              actionButton('退出', false, exit)
            );
            progressLabel.textContent = '第 ' + (index + 1) + ' / ' + STATIONS.length + ' 站';
            progressHint.textContent = complete ? '导览完成' : '上一站 / 下一站';
            progressBar.style.width = String(((index + 1) / STATIONS.length) * 100) + '%';
          }

          function init() {
            panel = document.getElementById('tourPanel');
            body = document.getElementById('tourBody');
            actions = document.getElementById('tourActions');
            progressLabel = document.getElementById('tourProgressLabel');
            progressHint = document.getElementById('tourProgressHint');
            progressBar = document.getElementById('tourProgressBar');
            toggleButton = document.getElementById('tourToggle');
            if (toggleButton) toggleButton.addEventListener('click', toggle);
            var exitButton = document.querySelector('[data-action="tour-exit"]');
            if (exitButton) exitButton.addEventListener('click', exit);
            document.addEventListener('keydown', function (event) {
              if (isTypingTarget(event.target) || event.defaultPrevented) return;
              if (event.key === 'ArrowLeft') {
                event.preventDefault();
                previous();
              } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                next();
              }
            });
            render();
          }

          return {
            init: init,
            count: count,
            enter: enter,
            next: next,
            previous: previous,
            restart: restart,
            exit: exit,
            syncFromRoute: syncFromRoute,
            hydrateCurrent: hydrateCurrent,
          };
        })();

        /* ------------------------------------------------------------------ App
           唯一初始化、订阅、渲染和生命周期收口。 */
        var App = (function () {
          var context = {
            route: null,
            projection: null,
            connection: null,
            error: '',
            errorRaw: '',
            lastGoodRoute: { scope: 'system' },
          };
          var scopeNav = null;
          var breadcrumbs = null;
          var stateNotice = null;
          var viewRoot = null;
          var headerScope = null;
          var liveRegion = null;
          var dock = null;
          var dockBody = null;
          var dockStatus = null;
          var graphFrame = 0;

          function scopeKeyForRoute(route) {
            if (!route) return 'system';
            if (route.scope === 'project' && route.project) return 'project:' + route.project;
            if (route.scope === 'task' && route.task) return 'task:' + route.task;
            if (route.scope === 'agent' && route.instance) return 'agent:' + route.instance;
            return 'system';
          }

          function projectionForRoute(route) {
            var ref = PayloadRefs.get(scopeKeyForRoute(route));
            if (ref) return ref.value;
            return MockDriver.projectionFor(scopeKeyForRoute(route));
          }

          function scopeLabel(route, projection) {
            if (!route || route.scope === 'error') return '错误';
            if (route.scope === 'project') return projection && projection.project ? projection.project.name : '项目';
            if (route.scope === 'task') return projection && projection.task ? projection.task.title : '任务';
            if (route.scope === 'agent') return projection && projection.agent ? projection.agent.role + ' · ' + projection.agent.instance : 'Agent';
            return '系统概要';
          }

          function announce(message) {
            if (!liveRegion) return;
            liveRegion.textContent = '';
            window.setTimeout(function () { liveRegion.textContent = message; }, 0);
          }

          function scheduleGraphDraw() {
            if (graphFrame) window.cancelAnimationFrame(graphFrame);
            graphFrame = window.requestAnimationFrame(function () {
              graphFrame = 0;
              drawGraphEdges();
            });
          }

          function drawGraphEdges() {
            var canvases = document.querySelectorAll('[data-control="orchestration-viewer"]');
            Array.prototype.forEach.call(canvases, function (canvas) {
              var svg = canvas.querySelector('.graph-svg');
              if (!svg) return;
              svg.replaceChildren();
              var canvasRect = canvas.getBoundingClientRect();
              var nodeMap = Object.create(null);
              Array.prototype.forEach.call(canvas.querySelectorAll('[data-node-id]'), function (node) {
                nodeMap[node.getAttribute('data-node-id')] = node;
              });
              Array.prototype.forEach.call(canvas.querySelectorAll('[data-node-id]'), function (node) {
                var deps = String(node.getAttribute('data-deps') || '').split(',').filter(Boolean);
                deps.forEach(function (depId) {
                  var dep = nodeMap[depId];
                  if (!dep) return;
                  var from = dep.getBoundingClientRect();
                  var to = node.getBoundingClientRect();
                  var x1 = from.left - canvasRect.left + from.width / 2;
                  var y1 = from.bottom - canvasRect.top;
                  var x2 = to.left - canvasRect.left + to.width / 2;
                  var y2 = to.top - canvasRect.top;
                  var mid = Math.max(12, (y2 - y1) / 2);
                  svg.appendChild(svgEl('path', {
                    class: 'graph-edge graph-edge--' + (node.getAttribute('data-state') || 'waiting'),
                    d: 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + mid) + ', ' + x2 + ' ' + (y2 - mid) + ', ' + x2 + ' ' + y2,
                  }));
                });
              });
            });
          }

          function renderDock() {
            if (!dockBody) return;
            var route = context.route || {};
            var selectedTask = route.task ? MockDriver.taskById(route.task) : null;
            var tasks = MockDriver.taskList();
            var taskSelect = el('select', {
              'aria-label': '选择 Mock 任务',
              'data-action': 'mock-pick-task',
              onchange: function (event) {
                var task = MockDriver.taskById(event.target.value);
                if (!task) return;
                UiEvents.emit('NavigationRequested', {
                  route: { scope: 'task', project: task.projectId, task: task.id },
                  source: 'mock',
                });
              },
            }, tasks.map(function (task) {
              var option = el('option', { value: task.id, text: task.title + ' · v' + task.currentRevision });
              if (selectedTask && selectedTask.id === task.id) option.setAttribute('selected', '');
              return option;
            }));

            var activityButtons = [];
            if (selectedTask) {
              var projection = projectionForRoute({ scope: 'task', task: selectedTask.id });
              (projection ? projection.activities : []).forEach(function (activity) {
                var disabled = activity.state !== 'active';
                activityButtons.push(
                  el('div', { class: 'row' }, [
                    el('span', { class: 'small muted', text: activity.name + ' · ' + (STATE_LABEL[activity.state] || activity.state) }),
                    el('button', {
                      class: 'btn btn--small',
                      type: 'button',
                      disabled: disabled ? true : null,
                      'data-action': 'mock-advance',
                      onclick: function () {
                        UiEvents.emit('ActivityAdvanceRequested', {
                          taskId: selectedTask.id,
                          nodeId: activity.nodeId,
                          outcome: 'success',
                        });
                      },
                    }, [el('span', { text: '成功' })]),
                    el('button', {
                      class: 'btn btn--small',
                      type: 'button',
                      disabled: disabled ? true : null,
                      'data-action': 'mock-fail',
                      onclick: function () {
                        UiEvents.emit('ActivityAdvanceRequested', {
                          taskId: selectedTask.id,
                          nodeId: activity.nodeId,
                          outcome: 'failure',
                        });
                      },
                    }, [el('span', { text: '失败' })]),
                  ])
                );
              });
            }

            var versionButtons = [];
            if (selectedTask) {
              MockDriver.revisionVersions(selectedTask.id).forEach(function (version) {
                versionButtons.push(
                  el('button', {
                    class: 'btn btn--small',
                    type: 'button',
                    disabled: version <= selectedTask.currentRevision ? true : null,
                    'data-action': 'mock-replan',
                    onclick: function () {
                      UiEvents.emit('ReplanRequested', { taskId: selectedTask.id, version: version });
                    },
                  }, [el('span', { text: 'v' + version })]),
                );
              });
            }

            var connection = MockDriver.connection();
            dockBody.replaceChildren(
              el('section', { class: 'dock-group' }, [
                el('h4', { text: 'Mock 任务' }),
                el('label', { class: 'field' }, [el('span', { text: '任务' }), taskSelect]),
                el('p', { class: 'small muted', text: '只改变本地演示状态，不连接 Runtime。' }),
              ]),
              el('section', { class: 'dock-group' }, [
                el('h4', { text: '推进活动' }),
                activityButtons.length ? el('div', { class: 'stack stack--tight' }, activityButtons) : el('p', { class: 'small muted', text: '当前任务没有可推进的 active 活动。' }),
              ]),
              el('section', { class: 'dock-group' }, [
                el('h4', { text: '应用修订' }),
                versionButtons.length ? el('div', { class: 'row' }, versionButtons) : el('p', { class: 'small muted', text: '当前任务没有可用修订。' }),
                el('p', { class: 'small muted', text: '修订只改变后续计划；已发生事实保持只读。' }),
              ]),
              el('section', { class: 'dock-group' }, [
                el('h4', { text: '连接与重置' }),
                el('button', {
                  class: 'btn btn--small',
                  type: 'button',
                  'data-action': 'mock-connection',
                  onclick: function () {
                    UiEvents.emit('ConnectionChangedRequested', { connected: !connection.connected });
                  },
                }, [el('span', { text: connection.connected ? '模拟断连' : '恢复连接' })]),
                el('button', {
                  class: 'btn btn--small',
                  type: 'button',
                  'data-action': 'mock-reset',
                  onclick: function () { UiEvents.emit('MockResetRequested', {}); },
                }, [el('span', { text: '重置 Mock' })]),
                el('p', { class: 'small muted', text: connection.connected ? 'freshness：已连接' : 'freshness：断连，保留上次内容' }),
              ])
            );
            if (dockStatus) {
              dockStatus.textContent = connection.connected ? '已连接' : '断连 · stale';
            }
          }

          function render() {
            if (!context.route) return;
            var navRoute = context.error ? { scope: 'system' } : context.route;
            scopeNav.replaceChildren(Controls.scopeNavigator(navRoute));
            breadcrumbs.replaceChildren(Controls.breadcrumbs(navRoute));
            stateNotice.replaceChildren(Controls.stateNotice(context));
            viewRoot.replaceChildren.apply(viewRoot, Views.render(context));
            headerScope.textContent = scopeLabel(context.route, context.projection);
            renderDock();
            scheduleGraphDraw();
            Evidence.sync(context);
            UiEvents.emit('ViewRendered', { route: context.route });
          }

          function onScopeSelected(envelope) {
            if (!envelope || !envelope.route) return;
            Evidence.clearDismissed();
            context.route = envelope.route;
            context.error = envelope.route.scope === 'error' ? String(envelope.route.error || '无法打开该范围') : '';
            context.errorRaw = envelope.route.raw || '';
            if (context.error) {
              context.projection = null;
            } else {
              context.lastGoodRoute = Object.assign({}, envelope.route);
              context.projection = projectionForRoute(envelope.route);
            }
            Tour.syncFromRoute(envelope.route);
            render();
            if (!context.error) announce('已切换到 ' + scopeLabel(context.route, context.projection));
          }

          function onProjection(envelope) {
            if (!envelope || !envelope.ref) return;
            if (envelope.scopeKey !== scopeKeyForRoute(context.route)) return;
            context.projection = envelope.ref.value;
            render();
          }

          function onConnection(envelope) {
            if (!envelope) return;
            context.connection = envelope.connection;
            render();
          }

          function toggleDock() {
            if (!dock) return;
            var open = dock.getAttribute('data-open') !== 'true';
            dock.setAttribute('data-open', open ? 'true' : 'false');
            var head = dock.querySelector('.dock-head');
            if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
            var headerToggle = document.getElementById('dockToggle');
            if (headerToggle) headerToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          }

          function bindShell() {
            var headerToggle = document.getElementById('dockToggle');
            if (headerToggle) headerToggle.addEventListener('click', toggleDock);
            var dockHead = dock ? dock.querySelector('.dock-head') : null;
            if (dockHead) dockHead.addEventListener('click', toggleDock);
            document.addEventListener('keydown', function (event) {
              if (event.key !== 'Escape') return;
              if (Evidence.isOpen()) {
                event.preventDefault();
                Evidence.close();
                return;
              }
              if (document.body.classList.contains('tour-open')) {
                event.preventDefault();
                Tour.exit();
              }
            });
            window.addEventListener('resize', scheduleGraphDraw);
          }

          function init() {
            scopeNav = document.getElementById('scopeNav');
            breadcrumbs = document.getElementById('breadcrumbs');
            stateNotice = document.getElementById('stateNotice');
            viewRoot = document.getElementById('viewRoot');
            headerScope = document.getElementById('headerScope');
            liveRegion = document.getElementById('liveRegion');
            dock = document.getElementById('mockDock');
            dockBody = document.getElementById('mockDockBody');
            dockStatus = document.getElementById('dockStatus');

            Evidence.init(function () { return context; });
            Tour.init();
            bindShell();

            UiEvents.subscribe('ProjectionAvailable', onProjection);
            UiEvents.subscribe('ProjectionUpdated', onProjection);
            UiEvents.subscribe('ScopeSelected', onScopeSelected);
            UiEvents.subscribe('ConnectionChanged', onConnection);
            MockDriver.subscribe();
            MockDriver.init();
            context.connection = MockDriver.connection();
            if (!location.hash) Tour.hydrateCurrent();
            Navigation.init();
          }

          return { init: init };
        })();

        window.TourPrototype = {
          getProjectionRef: function (scopeKey) {
            return PayloadRefs.get(String(scopeKey || ''));
          },
          subscribe: function (type, handler) {
            return UiEvents.subscribe(String(type || ''), handler);
          },
        };

        App.init();
      })();
    </script>
  </body>
</html>
